# Full stack locally: SQL Server + API + web. Run from the BE folder:
#   cp .env.example .env   (then set a strong MSSQL_SA_PASSWORD)
#   docker compose up --build
# Web:     http://localhost:8080
# Swagger: http://localhost:5080/swagger

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__TicketTracker: "Server=db,1433;Database=TicketTracker;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Database__ApplyMigrationsOnStartup: "true"
      OpenApi__Enabled: "true"
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../FE
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  sqldata:
